<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Kux</title>
  <desc id="desc">Kubernetes at terminal speed</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151827"/>
      <stop offset="0.55" stop-color="#202536"/>
      <stop offset="1" stop-color="#111420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8be9fd"/>
      <stop offset="0.5" stop-color="#bd93f9"/>
      <stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8be9fd" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8be9fd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8be9fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1040" cy="40" r="310" fill="url(#glow)"/>
  <path d="M870 36h260l72 72v176H942l-72-72z" fill="none" stroke="#bd93f9" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M1000 0l200 200M920 0l280 280M1080 0l120 120" stroke="#ff79c6" stroke-opacity="0.08" stroke-width="2"/>

  <g transform="translate(72 62)">
