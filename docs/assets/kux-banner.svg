    <path d="M60 50v84M60 93l58-43M60 93l58 41" fill="none" stroke="#8be9fd" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/>
    <circle cx="131" cy="50" r="7" fill="#ff79c6"/>
    <circle cx="131" cy="134" r="7" fill="#50fa7b"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="292" y="145" fill="url(#accent)" font-size="104" font-weight="800" letter-spacing="8">KUX</text>
    <text x="300" y="199" fill="#f8f8f2" font-size="30" font-weight="650" letter-spacing="0.5">Kubernetes at terminal speed.</text>
    <text x="302" y="241" fill="#8d93ad" font-size="17" font-weight="500" letter-spacing="3">RATATUI  •  WATCH-DRIVEN  •  BUILT FOR CLUSTER SCALE</text>
  </g>

  <g transform="translate(1012 245)" fill="none" stroke-linecap="round" stroke-width="5">
    <path d="M0 20h32" stroke="#50fa7b"/>
    <path d="M44 20h32" stroke="#8be9fd"/>
    <path d="M88 20h32" stroke="#bd93f9"/>
  </g>
