[package]
name = "kux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A high-performance, K9s-inspired Kubernetes terminal UI built for large clusters"
license = "Apache-2.0"
repository = "https://github.com/maxsxu/kux"
keywords = ["kubernetes", "tui", "ratatui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
futures = "0.3"
http = "1.3"
k8s-openapi = { version = "0.28", features = ["v1_32"] }
kube = { version = "4.0", features = ["gzip", "runtime"] }
libc = "0.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
regex = "1.11"
rustc-hash = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.48", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
